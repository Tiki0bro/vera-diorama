<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vera's Diorama - Printable Dragon Tower QR Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f1f5f9;
      font-family: 'Nunito', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .print-sheet {
      width: 100%;
      max-width: 820px;
      background: #ffffff;
      border: 8px solid #0f172a;
      border-radius: 28px;
      padding: 36px 32px 30px;
      box-shadow: 12px 12px 0px #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Top gold trim */
    .print-sheet::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 14px;
      background: repeating-linear-gradient(
        -45deg,
        #f59e0b,
        #f59e0b 14px,
        #0f172a 14px,
        #0f172a 28px
      );
      border-bottom: 3px solid #0f172a;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      color: #fef08a;
      padding: 6px 22px;
      border-radius: 999px;
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 10px;
      margin-bottom: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .headline {
      font-family: 'Cinzel', serif;
      font-size: 2.7rem;
      line-height: 1.15;
      letter-spacing: 1px;
      color: #0f172a;
      text-transform: uppercase;
      margin-bottom: 22px;
      max-width: 720px;
    }

    .headline .highlight-word {
      display: inline-block;
      background: #f59e0b;
      color: #0f172a;
      padding: 0 12px;
      border-radius: 8px;
      transform: rotate(-1deg);
    }

    /* 3-Column Display: Dragon Art - QR Center - Egg Art */
    .triptych-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 18px;
      margin-bottom: 24px;
    }

    .panel-frame {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      border: 4px solid #0f172a;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 6px 6px 0px #0f172a;
    }

    .panel-img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      border-bottom: 3px solid #0f172a;
    }

    .panel-label {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      padding: 8px 12px;
      text-transform: uppercase;
      background: #0f172a;
      color: #ffffff;
      width: 100%;
      font-weight: 700;
    }

    /* Center QR Frame */
    .qr-center-box {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
      border: 5px solid #0f172a;
      border-radius: 22px;
      padding: 16px 14px 14px;
      box-shadow: 8px 8px 0px #0f172a;
      position: relative;
    }

    .qr-corner-bracket {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 4px solid #f59e0b;
    }
    .corner-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .corner-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    .qr-tag-top {
      font-family: 'Cinzel', serif;
      font-size: 0.92rem;
      letter-spacing: 2px;
      color: #0f172a;
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .qr-img {
      width: 210px;
      height: 210px;
      display: block;
      image-rendering: pixelated;
    }

    .qr-scan-hint {
      margin-top: 10px;
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      letter-spacing: 1px;
      color: #0f172a;
      font-weight: 900;
    }

    /* Bottom Info & URL Strip */
    .footer-strip {
      width: 100%;
      border-top: 3px solid #0f172a;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 0.5px;
    }

    .url-chip {
      background: #f8fafc;
      border: 2px solid #0f172a;
      padding: 6px 18px;
      border-radius: 999px;
      font-family: monospace;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .print-btn-bar {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
    }

    .print-btn {
      background: #0f172a;
      color: #fef08a;
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      padding: 12px 28px;
      border: 3px solid #f59e0b;
      border-radius: 999px;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.4);
      cursor: pointer;
      text-transform: uppercase;
      font-weight: 700;
      transition: transform 0.15s ease;
    }

    .print-btn:hover {
      transform: scale(1.05);
      background: #1e293b;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .print-sheet {
        border-width: 6px;
        box-shadow: none;
        max-width: 100%;
        border-radius: 16px;
        padding: 24px 20px;
      }
      .print-btn-bar {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="print-sheet">
    <div class="tag-pill">&#10022; Student Exhibition &bull; Diorama Showcase &#10022;</div>

    <h1 class="headline">
      Scan To Watch The Video & Read The <span class="highlight-word">Story</span>
    </h1>

    <div class="triptych-row">
      <!-- Mother Dragon Art -->
      <div class="panel-frame">
        <img class="panel-img" src="mother_dragon.jpg" alt="Mother Dragon">
        <div class="panel-label">Mother Dragon</div>
      </div>

      <!-- Center QR Code -->
      <div class="qr-center-box">
        <div class="qr-corner-bracket corner-tl"></div>
        <div class="qr-corner-bracket corner-tr"></div>
        <div class="qr-corner-bracket corner-bl"></div>
        <div class="qr-corner-bracket corner-br"></div>
        
        <div class="qr-tag-top">&bull; Scan With Camera &bull;</div>
        <img class="qr-img" src="vera_diorama_qr.png" alt="Dragon Tower Diorama QR Code">
        <div class="qr-scan-hint">&#9654; Tap Link To Enter &#9664;</div>
      </div>

      <!-- Dragon Egg Art -->
      <div class="panel-frame">
        <img class="panel-img" src="dragon_egg.jpg" alt="Dragon Egg">
        <div class="panel-label">The Dragon Egg</div>
      </div>
    </div>

    <div class="footer-strip">
      <div>&starf; Vera Greening's Diorama Showcase</div>
      <div class="url-chip">https://tiki0bro.github.io/vera-diorama/</div>
      <div>Dragon Spire &starf;</div>
    </div>
  </div>

  <div class="print-btn-bar">
    <button class="print-btn" onclick="window.print()">&#128424; Print Exhibition Card</button>
  </div>
</body>
</html>
